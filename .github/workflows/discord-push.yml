on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          username: "Dan Bot"
          avatar_url: "https://i.imgur.com/GztTIZk.png"
          message: "Logs updated @ https://crtve.github.io/WvW-Logs/"
