on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get current GMT+8 Unix timestamp
        id: time
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Send message to Discord
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          username: "Dan Bot"
          avatar_url: "https://i.imgur.com/GztTIZk.png"
          message: |
            Logs updated @ https://crtve.github.io/WvW-Logs/ (Please give it a minute or so for it to reflect)
            Timestamp: <t:${{ steps.time.outputs.timestamp }}>


